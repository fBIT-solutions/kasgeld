---
name: "Bug report"
description: "Report a bug with the website"
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search through the existing issues to see if it is already reported.
- type: textarea
  attributes:
    label: "Browser details"
    description: "Paste the data from your browser."
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have enabled debug logging for my installation.
        required: true
      - label: I have filled out the issue template to the best of my ability.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate issue of any [previous issues](https://github.com/fbit-solutions/kasgeld/issues?q=is%3Aissue+label%3A%22Bug%22+).
        required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Debug logs"
    description: "To enable debug logs from the browser. Enable `inspect` and go to the console tab. Then reproduce the issue and copy the logs here."
    render: text
  validations:
    required: true

